services:
  api:
    build:
      context: ./apps/api
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=development
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/careerforge
      - JWT_SECRET=dev_secret_key
    depends_on:
      - mongo
    volumes:
      - ./apps/api:/usr/src/app
      - /usr/src/app/node_modules

  web:
    build:
      context: ./apps/web
      target: development
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:5000/api/v1
    volumes:
      - ./apps/web:/usr/src/app
      - /usr/src/app/node_modules
    command: npm run dev -- --host

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

volumes:
  mongo_data:
